le: dict(deps.items() + common_items)})\n\n    return select(crate_aliases)\n\n###############################################################################\n# WORKSPACE MEMBER DEPS, ALIASES, AND EDITIONS\n###############################################################################\n\n_CRATE_EDITIONS = {\n    \"packages/compiler-cli/preprocessor/ng-analyze\": \"2021\",\n}\n\n_NORMAL_DEPENDENCIES = {\n    \"packages/compiler-cli/preprocessor/ng-analyze\": {\n        _COMMON_CONDITION: {\n            \"futures\": Label(\"@crates//futures-0.3.34\"),\n            \"glob\": Label(\"@crates//glob-0.3.4\"),\n            \"json-strip-comments\": Label(\"@crates//json-strip-comments-3.1.2\"),\n            \"oxc_allocator\": Label(\"@crates//oxc_allocator-0.144.0\"),\n            \"oxc_ast\": Label(\"@crates//oxc_ast-0.144.0\"),\n            \"oxc_ast_visit\": Label(\"@crates//oxc_ast_visit-0.144.0\"),\n            \"oxc_diagnostics\": Label(\"@crates//oxc_diagnostics-0.144.0\"),\n            \"oxc_parser\": Label(\"@crates//oxc_parser-0.144.0\"),\n            \"oxc_resolver\": Label(\"@crates//oxc_resolver-11.24.3\"),\n            \"oxc_semantic\": Label(\"@crates//oxc_semantic-0.144.0\"),\n            \"oxc_span\": Label(\"@crates//oxc_span-0.144.0\"),\n            \"oxc_syntax\": Label(\"@crates//oxc_syntax-0.144.0\"),\n            \"pathdiff\": Label(\"@crates//pathdiff-0.2.3\"),\n            \"regex\": Label(\"@crates//regex-1.13.1\"),\n            \"self_cell\": Label(\"@crates//self_cell-1.3.0\"),\n            \"serde\": Label(\"@crates//serde-1.0.229\"),\n            \"serde_json\": Label(\"@crates//serde_json-1.0.151\"),\n        },\n        \"cfg(target_arch = \\\"wasm32\\\")\": {\n            \"js-sys\": Label(\"@crates//js-sys-0.3.98\"),\n            \"wasm-bindgen\": Label(\"@crates//wasm-bindgen-0.2.121\"),\n        },\n    },\n}\n\n\n_NORMAL_ALIASES = {\n    \"packages/compiler-cli/preprocessor/ng-analyze\": {\n        _COMMON_CONDITION: {\n        },\n   