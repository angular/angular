[package]
name = "ng-analyze"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
napi = { version = "3", features = ["napi4", "tokio_rt"], optional = true }
napi-derive = { version = "3", optional = true }
futures = { version = "0.3", features = ["executor", "alloc", "std", "thread-pool"] }
oxc_allocator = "0.144.0"
oxc_parser = "0.144.0"
oxc_ast = "0.144.0"
oxc_ast_visit = { version = "0.144.0", features = ["serialize"] }
oxc_resolver = "11.24.2"
oxc_span = "0.144.0"
oxc_semantic = "0.144.0"
oxc_syntax = "0.144.0"
oxc_diagnostics = "0.144.0"
oxc-miette-derive = "3.0.1"
self_cell = "1.3.0"

pathdiff = "0.2"
glob = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1"
json-strip-comments = "3.1.2"



[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
# Reflect/Uint8Array/Array, used by the JavaScript filesystem bridge in `physical_fs`.
js-sys = "0.3"

[dev-dependencies]
tempfile = "3"

[build-dependencies]
napi-build = { version = "2", optional = true }

[features]
default = []
napi = ["dep:napi", "dep:napi-derive", "dep:napi-build"]
