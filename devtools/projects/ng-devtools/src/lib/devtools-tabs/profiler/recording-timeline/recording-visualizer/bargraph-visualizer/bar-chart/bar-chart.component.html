<div class="wrapper">
  @for (bar of internalData(); track $index) {
    <div
      (click)="barClick.emit(data()[$index])"
      class="bar"
      [class.highlighted]="highlighted() === bar.original"
      [style.width.%]="bar.width"
      [style.animation-delay]="$index * 0.1 + 's'"
    >
      <span class="text">
        <span class="label">{{ bar.label }}</span>
        <span class="time pill">{{ bar.time | number: '1.0-1' }} ms</span>
        <span class="count pill"
          >{{ bar.count }} {{ bar.count !== 1 ? 'instances' : 'instance' }}</span
        >
      </span>
    </div>
  }
</div>
