<mat-toolbar>
  {{ directive() }}
  <span class="button-wrapper">
    <button
      ng-button
      btnType="icon"
      (click)="openFilter.emit(!filterOpened())"
      [class.selected]="filterOpened()"
      [matTooltip]="!filterOpened() ? 'Show filter' : 'Hide filter'"
      [ariaLabel]="!filterOpened() ? 'Show filter' : 'Hide filter'"
    >
      <mat-icon>filter_alt</mat-icon>
    </button>
    <button
      ng-button
      btnType="icon"
      (click)="handleLogInstance($event)"
      matTooltip="Log directive instance to console"
      aria-label="Log directive instance to console"
    >
      <mat-icon> terminal </mat-icon>
    </button>
    <button
      ng-button
      btnType="icon"
      [disabled]="disableViewSourceButton()"
      (click)="handleViewSource($event)"
      [matTooltip]="viewSourceTooltip()"
      [attr.aria-label]="viewSourceTooltip()"
    >
      <mat-icon> code </mat-icon>
    </button>
  </span>
</mat-toolbar>
