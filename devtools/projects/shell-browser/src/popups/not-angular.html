<html>
  <head>
    <style>
      * {
        margin: 0;
        padding: 0;
      }

      .header-text {
        margin: 0px;
        text-align: center;
        padding-bottom: 8px;
      }

      .modal-content {
        min-width: 300px;
        padding: 10px;
      }

      .icon {
        width: 20px;
        margin-right: 16px;
      }

      .message {
        display: flex;
        align-items: center;
        padding: 0 5px;
      }

      code {
        font-size: 1em;
        font-family: monospace;
      }

      p:not(:last-child) {
        margin-bottom: 10px;
      }

      .angie {
        height: 56px;
        width: auto;
        margin-right: 12px;
        flex-shrink: 0;
      }
    </style>
  </head>

  <body>
    <div class="modal-content">
      <h4 class="header-text">Angular DevTools</h4>
      <div class="message">
        <img class="angie" src="../assets/angie-sad.svg" alt="Angie illustration" />
        <p>This page is not using Angular, or it has a strict extension policy.</p>
      </div>
    </div>
  </body>
</html>
