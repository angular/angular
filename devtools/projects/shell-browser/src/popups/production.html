<html>
  <head>
    <style>
      * {
        margin: 0;
        padding: 0;
      }

      .header-text {
        margin: 0px;
        text-align: center;
        padding-bottom: 8px;
      }

      .modal-content {
        min-width: 300px;
        padding: 10px;
      }

      .icon {
        width: 20px;
        margin-right: 16px;
      }

      .message {
        display: flex;
        align-items: center;
        padding: 0 5px;
      }

      code {
        font-family: monospace;
        font-size: 0.9em;
        background: #f1f1f1;
        padding: 2px 6px;
        border-radius: 4px;
      }

      p:not(:last-child) {
        margin-bottom: 10px;
      }

      .angie {
        height: 56px;
        width: auto;
        margin-right: 12px;
        flex-shrink: 0;
      }
    </style>
  </head>

  <body>
    <div class="modal-content">
      <h4 class="header-text">Angular DevTools</h4>
      <div class="message">
        <img class="angie" src="../assets/angie-teaching.svg" alt="Angie illustration" />
        <section>
          <p>
            Angular application running in
            <a
              href="https://angular.dev/api/core/enableProdMode"
              target="_blank"
              rel="noopener noreferrer"
              >production mode</a
            >.
          </p>
          <p>We recommend using DevTools with apps in dev mode, running <code>ng serve</code>.</p>
        </section>
      </div>
    </div>
  </body>
</html>
