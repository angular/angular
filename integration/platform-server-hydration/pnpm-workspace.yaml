allowBuilds:
  '@parcel/watcher': false
  esbuild: false
  lmdb: false
  msgpackr-extract: false
# The minimum age of a release to be considered for dependency installation.
# The value is in minutes (1440 minutes = 1 day).
minimumReleaseAge: 1440
# List of packages to exclude from the minimum release age check.
minimumReleaseAgeExclude:
  - '@angular-devkit/*'
  - '@angular/*'
  - '@ngtools/webpack'
  - '@schematics/*'
  - 'ng-packagr'
  - 'zone.js'
shamefullyHoist: true

# Temporary until https://github.com/angular/angular-cli/pull/34770 is released.
patchedDependencies:
  '@angular/build@22.3.0-rc.0': patches/@angular+build@22.3.0-rc.0.patch
